<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>Login - Portal de Rastreamento</title>
</h:head>
<h:body>
    <h1>Portal de Rastreamento</h1>
    <h:form>
        <p:panelGrid columns="2">
            <p:outputLabel value="Usuário:" />
            <p:inputText />
            <p:outputLabel value="Senha:" />
            <p:password />
        </p:panelGrid>
        <p:button value="Entrar" outcome="index" />
    </h:form>
</h:body>
</html>
