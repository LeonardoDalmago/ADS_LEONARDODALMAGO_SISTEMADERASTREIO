<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui">

    <h:head>
        <f:facet name="first">
            <meta http-equiv="X-UA-Compatible" content="IE=edge" />
            <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"/>
        </f:facet>
        <title>Portal Rastreamento Tecnotri - Login</title>
    </h:head>

    <h:body styleClass="login-body">
        <h:form id="loginForm">
            <p:growl id="growl" showDetail="true" />
            <div class="grid grid-nogutter">
                <div class="col-12" style="text-align: center; margin-bottom: 20px;">
                    <p:graphicImage name="images/logo-tecnotri.png" library="manhattan-layout" style="max-width: 220px;" />
                </div>
            </div>
            
            <div class="login-panel">
                <div class="grid">
                    <div class="col-12 lg:col-6 left-side">
                        <p:graphicImage name="images/login/login-photo.png" library="manhattan-layout" class="login-image" />
                    </div>

                    <div class="col-12 lg:col-6 right-side ui-fluid">
                        <div class="col-12 container">
                            <h3>Bem-vindo!</h3>
                            <h2>Portal de rastreamento</h2>
                        </div>
                        <div class="col-12">
                            <div class="input-wrapper ui-input-icon-left">
                                <i class="pi pi-user"></i>
                                <p:inputText value="#{loginBean.login}" required="true" requiredMessage="Login obrigatório" placeholder="Usuário"/>                        
                            </div>
                        </div>
                        <div class="col-12">
                            <div class="input-wrapper ui-input-icon-left">
                                <i class="pi pi-lock"></i>                                
                                <p:password value="#{loginBean.senha}" required="true" requiredMessage="Senha obrigatória" placeholder="Senha"/>
                            </div>
                        </div>
                        <div class="col-12 button-container">                            
                            <p:commandButton value="Acessar" update="@form" action="#{loginBean.entrar()}" />
                        </div>
                    </div>
                </div>
            </div>            
        </h:form>
    </h:body>
    <h:outputStylesheet name="css/primeicons.css" library="manhattan-layout"/>
    <h:outputStylesheet name="css/primeflex.min.css" library="manhattan-layout"/>
    <h:outputStylesheet name="css/layout-cyan-deeporange.css" library="manhattan-layout" />
</html>
