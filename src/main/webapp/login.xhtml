<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui">

    <h:head>
        <f:facet name="first">
            <meta http-equiv="X-UA-Compatible" content="IE=edge" />
            <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"/>
            <meta name="apple-mobile-web-app-capable" content="yes" />
        </f:facet>
        <title>Portal Rastreamento Tecnotri - Login</title>
    </h:head>

    <h:body styleClass="login-body">
        <h:form id="CreateForm">
            <p:growl id="growl" showDetail="true" />

            <!-- Logo Tecnotri centralizada acima do container -->
            <div class="grid grid-nogutter">
                <div class="col-12" style="text-align: center; margin-bottom: 20px;">
                    <p:graphicImage name="images/logo-tecnotri.png" 
                                    library="manhattan-layout" 
                                    class="logo" 
                                    style="max-width: 220px; height: auto; display: inline-block;" />
                </div>
            </div>
            
            <!-- Container principal do Login -->
            <div class="login-panel">
                <div class="grid">
                    <!-- Foto lateral personalizada -->
                    <div class="col-12 lg:col-6 left-side">
                        <p:graphicImage name="images/login/login-photo.png" 
                                        library="manhattan-layout" 
                                        class="login-image" />
                    </div>

                    <!-- Campos de acesso -->
                    <div class="col-12 lg:col-6 right-side ui-fluid">
                        <div class="col-12 container">
                            <h3>Bem-vindo!</h3>
                            <h2>Portal de rastreamento Tecnotri</h2>
                        </div>
                        <div class="col-12">
                            <div class="input-wrapper ui-input-icon-left">
                                <i class="pi pi-user"></i>
                                <p:inputText id="email" 
                                             autocomplete="off" 
                                             required="true" 
                                             requiredMessage="O Login/E-mail é obrigatório!" 
                                             placeholder="Usuário"/>                        
                            </div>
                        </div>
                        <div class="col-12">
                            <div class="input-wrapper ui-input-icon-left">
                                <i class="pi pi-lock"></i>                                
                                <p:password id="senha" 
                                             autocomplete="off" 
                                             required="true" 
                                             requiredMessage="A senha é obrigatória!" 
                                             placeholder="Senha"/>
                            </div>
                        </div>
                        <div class="col-12 button-container">                            
                            <p:commandButton id="btnLogar" 
                                             value="Acessar" 
                                             update="@form" 
                                             action="index?faces-redirect=true" />
                        </div>
                    </div>
                </div>
            </div>            
        </h:form>
    </h:body>

    <h:outputStylesheet name="css/primeicons.css" library="manhattan-layout"/>
    <h:outputStylesheet name="css/primeflex.min.css" library="manhattan-layout"/>
    <h:outputStylesheet name="css/layout-cyan-deeporange.css" library="manhattan-layout" />

</html>
