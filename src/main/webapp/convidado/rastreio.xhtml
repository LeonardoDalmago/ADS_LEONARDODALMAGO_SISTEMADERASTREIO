<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <h:outputStylesheet name="css/primeicons.css" library="manhattan-layout" />
    <h:outputStylesheet name="css/primeflex.min.css" library="manhattan-layout" />
    <h:outputStylesheet name="css/layout-cyan-deeporange.css" library="manhattan-layout" />
    <title>Rastrear pedido - Tecnotri</title>
    <style>
        body { margin: 0; background: #f3f4f6; font-family: sans-serif; }
        .topo { background: #fff; color: #1f2937; padding: 12px 24px; border-bottom: 1px solid #e5e7eb;
                display: flex; justify-content: space-between; align-items: center; gap: 12px; }
        .topo .marca { display: flex; align-items: center; gap: 12px; }
        .topo h1 { margin: 0; font-size: 1.2rem; }
        .conteudo { max-width: 860px; margin: 24px auto; padding: 0 16px; }
        .espaco { margin-top: 16px; }
        .linha-busca { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .etapas { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
        .etapa { flex: 1; min-width: 110px; padding: 10px; text-align: center; border-radius: 6px;
                 background: #e5e7eb; color: #6b7280; font-size: 0.9rem; }
        .etapa.ativa { background: #16a34a; color: #fff; font-weight: bold; }
    </style>
</h:head>
<h:body>
    <div class="topo">
        <div class="marca">
            <p:graphicImage name="images/logo-tecnotri.png" library="manhattan-layout" style="max-height: 40px;" />
            <h1>Rastreamento de Pedidos - Tecnotri</h1>
        </div>
        <h:form>
            <p:button value="Voltar ao login" outcome="/login" icon="pi pi-arrow-left" />
        </h:form>
    </div>

    <div class="conteudo">
        <h:form id="form">
            <p:messages id="msgs" showDetail="false" closable="true" />

            <p:panel header="Rastrear pedido">
                <p>Digite o código de rastreio para ver o andamento do seu pedido. Não precisa fazer login.</p>
                <div class="linha-busca">
                    <p:outputLabel for="codigo" value="Código de rastreio:" />
                    <p:inputText id="codigo" value="#{rastreioConvidadoBean.codigo}" maxlength="50" />
                    <p:commandButton id="btnBuscar" value="Rastrear" icon="pi pi-search"
                                     action="#{rastreioConvidadoBean.rastrear}" update="@form" />
                    <p:defaultCommand target="btnBuscar" />
                </div>
            </p:panel>

            <p:panel header="Andamento do pedido" styleClass="espaco"
                     rendered="#{rastreioConvidadoBean.pedido != null}">
                <div class="etapas">
                    <ui:repeat value="#{rastreioConvidadoBean.etapas}" var="etapa" varStatus="st">
                        <div class="#{st.index le rastreioConvidadoBean.indiceStatus ? 'etapa ativa' : 'etapa'}">
                            <h:outputText value="#{etapa}" />
                        </div>
                    </ui:repeat>
                </div>

                <h:panelGrid columns="2" cellpadding="6">
                    <h:outputText value="Código:" style="font-weight:bold" />
                    <h:outputText value="#{rastreioConvidadoBean.pedido.codigoRastreio}" />

                    <h:outputText value="Produto:" style="font-weight:bold" />
                    <h:outputText value="#{rastreioConvidadoBean.pedido.produto}" />

                    <h:outputText value="Transportadora:" style="font-weight:bold" />
                    <h:outputText value="#{rastreioConvidadoBean.pedido.transportadora.nome}" />

                    <h:outputText value="Cliente:" style="font-weight:bold" />
                    <h:outputText value="#{rastreioConvidadoBean.clienteMascarado}" />

                    <h:outputText value="Status atual:" style="font-weight:bold" />
                    <p:tag value="#{rastreioConvidadoBean.pedido.status.descricao}" severity="info" />

                    <h:outputText value="Última atualização:" style="font-weight:bold" />
                    <h:outputText value="#{rastreioConvidadoBean.pedido.dataAtualizacao}">
                        <f:convertDateTime pattern="dd/MM/yyyy HH:mm" timeZone="America/Sao_Paulo" />
                    </h:outputText>
                </h:panelGrid>
            </p:panel>

            <div class="espaco">
                <p:button value="Falar com o suporte" outcome="/convidado/suporte" icon="pi pi-comments">
                    <f:param name="codigo" value="#{rastreioConvidadoBean.pedido.codigoRastreio}" />
                </p:button>
            </div>
        </h:form>
    </div>
</h:body>
</html>
