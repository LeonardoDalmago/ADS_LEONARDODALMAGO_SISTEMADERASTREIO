<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">

    <ui:define name="title">Transportadoras - Tecnotri</ui:define>

    <ui:define name="content">
        <h:form id="form">
            <p:growl id="messages" showDetail="true"/>

            <div class="card">
                <h5>Gerenciamento de Transportadoras</h5>

                <div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px;">
                    <p:inputText id="busca" value="#{transportadoraBean.termoBusca}" placeholder="Buscar por nome"
                                 style="min-width: 260px;"/>
                    <p:commandButton value="Buscar" icon="pi pi-search" action="#{transportadoraBean.buscar}"
                                     process="busca @this" update="dt-transportadoras"/>
                    <p:commandButton value="Limpar" icon="pi pi-times" action="#{transportadoraBean.limparBusca}"
                                     process="@this" update="busca dt-transportadoras" resetValues="true"
                                     styleClass="ui-button-secondary"/>
                    <span style="flex: 1;"></span>
                    <p:commandButton process="@this" value="Nova Transportadora" icon="pi pi-plus"
                                     actionListener="#{transportadoraBean.prepararNovo}"
                                     update=":form:manage-transportadora-content"
                                     oncomplete="PF('manageTransportadoraDialog').show()"
                                     styleClass="ui-button-success"/>
                </div>

                <p:dataTable id="dt-transportadoras" value="#{transportadoraBean.transportadoras}" var="tr"
                             rows="10" paginator="true" paginatorPosition="bottom"
                             emptyMessage="Nenhuma transportadora encontrada.">
                    <p:column headerText="Nome">
                        <h:outputText value="#{tr.nome}"/>
                    </p:column>
                    <p:column headerText="CNPJ">
                        <h:outputText value="#{tr.cnpj}"/>
                    </p:column>
                    <p:column headerText="Telefone">
                        <h:outputText value="#{tr.telefone}"/>
                    </p:column>
                    <p:column headerText="E-mail">
                        <h:outputText value="#{tr.email}"/>
                    </p:column>
                    <p:column headerText="Pedidos" style="width: 90px; text-align: center;">
                        <h:outputText value="#{transportadoraBean.quantidadePedidos(tr)}"/>
                    </p:column>
                    <p:column headerText="Ações" style="width: 120px; text-align: center;">
                        <p:commandButton process="@this" icon="pi pi-pencil" update=":form:manage-transportadora-content"
                                         oncomplete="PF('manageTransportadoraDialog').show()"
                                         actionListener="#{transportadoraBean.prepararEdicao(tr)}"
                                         title="Editar"
                                         styleClass="edit-button rounded-button ui-button-success"/>
                        <p:commandButton process="@this" icon="pi pi-trash" styleClass="rounded-button ui-button-warning"
                                         actionListener="#{transportadoraBean.excluir(tr)}"
                                         update=":form:dt-transportadoras :form:messages"
                                         onclick="return confirm('Excluir esta transportadora?');"
                                         title="Excluir"/>
                    </p:column>
                </p:dataTable>
            </div>

            <p:dialog header="Detalhes da Transportadora" showEffect="fade" modal="true"
                      widgetVar="manageTransportadoraDialog" responsive="true" draggable="false" resizable="false">
                <p:outputPanel id="manage-transportadora-content" styleClass="ui-fluid">
                    <div class="field">
                        <p:outputLabel for="nome">Nome</p:outputLabel>
                        <p:inputText id="nome" value="#{transportadoraBean.transportadora.nome}" maxlength="120"
                                     required="true" requiredMessage="Informe o nome da transportadora."/>
                    </div>
                    <div class="field">
                        <p:outputLabel for="cnpj">CNPJ</p:outputLabel>
                        <p:inputMask id="cnpj" value="#{transportadoraBean.transportadora.cnpj}"
                                     mask="99.999.999/9999-99"/>
                    </div>
                    <div class="field">
                        <p:outputLabel for="telefone">Telefone</p:outputLabel>
                        <p:inputMask id="telefone" value="#{transportadoraBean.transportadora.telefone}"
                                     mask="(99) 99999-9999"/>
                    </div>
                    <div class="field">
                        <p:outputLabel for="email">E-mail</p:outputLabel>
                        <p:inputText id="email" value="#{transportadoraBean.transportadora.email}" maxlength="120">
                            <f:validateRegex pattern="[^@\s]+@[^@\s]+\.[^@\s]+"/>
                        </p:inputText>
                    </div>
                </p:outputPanel>

                <f:facet name="footer">
                    <p:commandButton value="Salvar" icon="pi pi-check" actionListener="#{transportadoraBean.salvar}"
                                     update="manage-transportadora-content dt-transportadoras messages"
                                     process="manage-transportadora-content @this"
                                     oncomplete="if (args &amp;&amp; !args.validationFailed) PF('manageTransportadoraDialog').hide()"/>
                    <p:commandButton value="Cancelar" icon="pi pi-times"
                                     onclick="PF('manageTransportadoraDialog').hide()"
                                     styleClass="ui-button-secondary" type="button"/>
                </f:facet>
            </p:dialog>
        </h:form>
    </ui:define>
</ui:composition>
