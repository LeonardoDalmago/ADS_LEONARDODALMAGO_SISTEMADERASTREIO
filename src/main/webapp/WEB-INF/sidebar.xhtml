<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:f="jakarta.faces.core"
    xmlns:h="jakarta.faces.html"
    xmlns:ui="jakarta.faces.facelets"
    xmlns:p="http://primefaces.org/ui">

    <aside class="tt-sidebar" id="tt-sidebar">
        <nav class="tt-nav">
            <div class="tt-nav-label">Menu</div>

            <h:link outcome="/index" styleClass="tt-nav-item #{view.viewId eq '/index.xhtml' ? 'ativo' : ''}">
                <i class="pi pi-home"></i>
                <span>Início</span>
            </h:link>

            <h:panelGroup layout="block" rendered="#{loginBean.administrador}">
                <div class="tt-nav-label">Cadastros</div>

                <h:link outcome="/pedidos" styleClass="tt-nav-item #{view.viewId eq '/pedidos.xhtml' ? 'ativo' : ''}">
                    <i class="pi pi-list"></i>
                    <span>Pedidos</span>
                </h:link>

                <h:link outcome="/transportadoras" styleClass="tt-nav-item #{view.viewId eq '/transportadoras.xhtml' ? 'ativo' : ''}">
                    <i class="pi pi-briefcase"></i>
                    <span>Transportadoras</span>
                </h:link>
            </h:panelGroup>

            <div class="tt-nav-label">Acesso público</div>

            <h:link outcome="/convidado/rastreio" target="_blank" styleClass="tt-nav-item">
                <i class="pi pi-search"></i>
                <span>Rastreio do convidado</span>
            </h:link>
        </nav>

        <div class="tt-sidebar-foot">Portal de Rastreamento</div>
    </aside>
</ui:composition>
