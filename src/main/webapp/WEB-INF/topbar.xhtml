<ui:composition 
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:f="jakarta.faces.core"
    xmlns:h="jakarta.faces.html"
    xmlns:ui="jakarta.faces.facelets"
    xmlns:p="http://primefaces.org/ui">

    <div class="layout-topbar">
        <a href="#" id="layout-menu-btn" class="menu-btn">
            <i class="pi pi-bars"></i>
        </a>

        <div class="layout-topbar-logo">
            <h:link outcome="/index">
                <p:graphicImage name="images/logo-tecnotri.png" library="manhattan-layout" style="height: 40px; margin-top: 5px;"/>
            </h:link>
        </div>

        <a id="topbar-menu-btn" href="#" class="topbar-menu-btn">
            <i class="pi pi-ellipsis-v"></i>
        </a>

        <div class="layout-topbar-menu-wrapper">
            <ul class="topbar-menu">
                <li class="profile-item">
                    <a href="#">
                        <p:graphicImage name="images/avatar1.png" library="manhattan-layout" />
                        <span class="topbar-item-name">#{loginBean.login != null ? loginBean.login : 'Usuário'}</span>
                    </a>
                    <ul class="animated">
                        <li role="menuitem">
                            <h:form style="margin:0; padding:0;">
                                <p:commandLink action="#{loginBean.deslogar()}" style="display: flex; align-items: center; gap: 10px;">
                                    <i class="pi pi-sign-out"></i>
                                    <span>Sair do Sistema</span>
                                </p:commandLink>
                            </h:form>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</ui:composition>
