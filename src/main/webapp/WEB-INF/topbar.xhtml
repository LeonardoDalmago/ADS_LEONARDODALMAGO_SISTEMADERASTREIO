<ui:composition

    xmlns:f="jakarta.faces.core"
    xmlns:h="jakarta.faces.html"
    xmlns:ui="jakarta.faces.facelets"

    xmlns:pa="http://primefaces.org/manhattan">

    <div class="layout-topbar">

        </div>

        <div class="layout-topbar-right">

            <ul class="topbar-items animated fadeInDown">
                <li class="profile-item">
                    <a href="#">                            
                        <p:graphicImage name="images/avatar.png" library="manhattan-layout" />

                    </a>
                    
                    <ul class="fadeInDown">
                        <li role="menuitem">
                            <a href="#">
                                <i class="pi pi-fw pi-user"></i>

                                <span class="topbar-badge">5</span>

                        <li role="menuitem">
                            <a href="#">

                            <a href="#">
                                <i class="pi pi-fw pi-sign-out"></i>
                                <span>Logout</span>

                    </ul>
                </li>
                <li>

                    <ul class="fadeInDown">
                        <li role="menuitem">
                            <a href="#" class="topbar-message">
                                <p:graphicImage name="images/avatar-1.png" library="manhattan-layout" width="35"/>

                        <li role="menuitem">

                            </a>

                        <li role="menuitem">
                            <a href="#" class="topbar-message">
                                <p:graphicImage name="images/avatar-3.png" library="manhattan-layout" width="35"/>

                            </a>

                        <li role="menuitem">
                            <a href="#" class="topbar-message">
                                <p:graphicImage name="images/avatar-4.png" library="manhattan-layout" width="35"/>

                            </a>
                        </li>
                        <li role="menuitem">
                            <a href="#" class="topbar-message">
                                <p:graphicImage name="images/avatar-5.png" library="manhattan-layout" width="35"/>

                            </a>

                    </ul>
                </li>
                <li>

                                <i class="pi pi-fw pi-calendar-times"></i>
