<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui"
      lang="pt-BR">

<h:head>
    <f:facet name="first">
        <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <meta name="color-scheme" content="light dark"/>
    </f:facet>
    <title><ui:insert name="title">Portal de Rastreamento - Tecnotri</ui:insert></title>
    <h:outputStylesheet name="css/primeicons.css" library="manhattan-layout"/>
    <h:outputStylesheet name="css/primeflex.min.css" library="manhattan-layout"/>
    <h:outputScript name="js/tecnotri.js" library="tecnotri" target="head"/>
    <ui:insert name="head"/>
    <f:facet name="last">
        <h:outputStylesheet name="css/tecnotri.css" library="tecnotri"/>
    </f:facet>
</h:head>

<h:body styleClass="tt-body">
    <ui:include src="./topbar.xhtml"/>

    <div class="tt-app">
        <ui:include src="./sidebar.xhtml"/>

        <div class="tt-main">
            <main class="tt-content">
                <ui:insert name="content"/>
            </main>

            <ui:include src="./footer.xhtml"/>
        </div>
    </div>

    <div id="tt-mask" class="tt-mask"></div>

    <p:ajaxStatus styleClass="tt-ajax">
        <f:facet name="start">
            <i class="pi pi-spin pi-spinner" aria-hidden="true"/>
        </f:facet>
        <f:facet name="complete">
            <h:outputText value=""/>
        </f:facet>
    </p:ajaxStatus>
</h:body>

</html>
