<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">

    <ui:define name="title">Usuários</ui:define>

    <ui:define name="content">
        <p:growl id="msgs" life="4000"/>

        <div class="card">
            <h:form id="formLista">
                <h2>Usuários</h2>

                <div style="display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1rem">
                    <p:inputText value="#{usuarioController.termoBusca}" placeholder="Buscar por nome"/>
                    <p:commandButton value="Buscar" icon="pi pi-search"
                                     actionListener="#{usuarioController.buscar}"
                                     process="@form" update="tabela :msgs"/>
                    <p:commandButton value="Limpar" icon="pi pi-times" styleClass="ui-button-secondary"
                                     actionListener="#{usuarioController.limpar}"
                                     process="@this" update="@form :msgs"/>
                    <p:commandButton value="Novo usuário" icon="pi pi-plus"
                                     actionListener="#{usuarioController.novo}"
                                     process="@this" update=":formDialog"
                                     oncomplete="PF('dlgUsuario').show()"/>
                </div>

                <p:dataTable id="tabela" var="item" value="#{usuarioController.lista}"
                             rows="10" paginator="true" emptyMessage="Nenhum registro encontrado">
                    <p:column headerText="Código" style="width: 6rem">
                        <h:outputText value="#{item.id}"/>
                    </p:column>
                    <p:column headerText="Nome">
                        <h:outputText value="#{item.nome}"/>
                    </p:column>
                    <p:column headerText="Login">
                        <h:outputText value="#{item.login}"/>
                    </p:column>
                    <p:column headerText="Perfil">
                        <h:outputText value="#{item.perfil.descricao}"/>
                    </p:column>
                    <p:column headerText="Ações" style="width: 8rem">
                        <p:commandButton icon="pi pi-pencil" title="Editar"
                                         actionListener="#{usuarioController.editar(item)}"
                                         process="@this" update=":formDialog"
                                         oncomplete="PF('dlgUsuario').show()"/>
                        <p:commandButton icon="pi pi-trash" title="Excluir" styleClass="ui-button-danger"
                                         actionListener="#{usuarioController.excluir(item)}"
                                         process="@this" update="tabela :msgs">
                            <p:confirm header="Confirmação" message="Deseja excluir este usuário?"
                                       icon="pi pi-exclamation-triangle"/>
                        </p:commandButton>
                    </p:column>
                </p:dataTable>

                <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                    <p:commandButton value="Sim" type="button" styleClass="ui-confirmdialog-yes" icon="pi pi-check"/>
                    <p:commandButton value="Não" type="button" styleClass="ui-confirmdialog-no ui-button-secondary" icon="pi pi-times"/>
                </p:confirmDialog>
            </h:form>
        </div>

        <p:dialog header="Usuário" widgetVar="dlgUsuario" modal="true"
                  responsive="true" width="420" draggable="false" resizable="false">
            <h:form id="formDialog">
                <p:outputPanel rendered="#{usuarioController.selecionado != null}">
                    <h:panelGrid columns="1" cellpadding="4" style="width: 100%">
                        <p:outputLabel for="nome" value="Nome"/>
                        <p:inputText id="nome" value="#{usuarioController.selecionado.nome}"
                                     maxlength="100" style="width: 100%"/>

                        <p:outputLabel for="login" value="Login"/>
                        <p:inputText id="login" value="#{usuarioController.selecionado.login}"
                                     maxlength="50" style="width: 100%"/>

                        <p:outputLabel for="senha" value="Senha"/>
                        <p:password id="senha" value="#{usuarioController.selecionado.senha}"
                                    redisplay="true" feedback="false" maxlength="100" style="width: 100%"/>

                        <p:outputLabel for="perfil" value="Perfil"/>
                        <p:selectOneMenu id="perfil" value="#{usuarioController.selecionado.perfil}"
                                         style="width: 100%">
                            <f:selectItems value="#{usuarioController.perfis}" var="pf"
                                           itemValue="#{pf}" itemLabel="#{pf.descricao}"/>
                        </p:selectOneMenu>
                    </h:panelGrid>

                    <div style="margin-top: 1rem; display: flex; gap: .5rem; justify-content: flex-end">
                        <p:commandButton value="Cancelar" icon="pi pi-times" styleClass="ui-button-secondary"
                                         type="button" onclick="PF('dlgUsuario').hide()"/>
                        <p:commandButton value="Salvar" icon="pi pi-check"
                                         actionListener="#{usuarioController.salvar}"
                                         process="@form" update="@form :formLista:tabela :msgs"
                                         oncomplete="if (args &amp;&amp; args.fechar) PF('dlgUsuario').hide()"/>
                    </div>
                </p:outputPanel>
            </h:form>
        </p:dialog>
    </ui:define>
</ui:composition>
