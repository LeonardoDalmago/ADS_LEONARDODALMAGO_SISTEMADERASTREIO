<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">

    <ui:define name="title">Clientes</ui:define>

    <ui:define name="content">
        <p:growl id="msgs" life="4000"/>

        <div class="card">
            <h:form id="formLista">
                <h2>Clientes</h2>

                <div style="display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1rem">
                    <p:inputText value="#{clienteController.termoBusca}" placeholder="Buscar por razão social ou CNPJ"/>
                    <p:commandButton value="Buscar" icon="pi pi-search"
                                     actionListener="#{clienteController.buscar}"
                                     process="@form" update="tabela :msgs"/>
                    <p:commandButton value="Limpar" icon="pi pi-times" styleClass="ui-button-secondary"
                                     actionListener="#{clienteController.limpar}"
                                     process="@this" update="@form :msgs"/>
                    <p:commandButton value="Novo cliente" icon="pi pi-plus"
                                     actionListener="#{clienteController.novo}"
                                     process="@this" update=":formDialog"
                                     oncomplete="PF('dlgCliente').show()"/>
                </div>

                <p:dataTable id="tabela" var="item" value="#{clienteController.lista}"
                             rows="10" paginator="true" emptyMessage="Nenhum registro encontrado">
                    <p:column headerText="Código" style="width: 6rem">
                        <h:outputText value="#{item.id}"/>
                    </p:column>
                    <p:column headerText="Razão social">
                        <h:outputText value="#{item.razaoSocial}"/>
                    </p:column>
                    <p:column headerText="CNPJ">
                        <h:outputText value="#{item.cnpjFormatado}"/>
                    </p:column>
                    <p:column headerText="Ações" style="width: 8rem">
                        <p:commandButton icon="pi pi-pencil" title="Editar"
                                         actionListener="#{clienteController.editar(item)}"
                                         process="@this" update=":formDialog"
                                         oncomplete="PF('dlgCliente').show()"/>
                        <p:commandButton icon="pi pi-trash" title="Excluir" styleClass="ui-button-danger"
                                         actionListener="#{clienteController.excluir(item)}"
                                         process="@this" update="tabela :msgs">
                            <p:confirm header="Confirmação" message="Deseja excluir este cliente?"
                                       icon="pi pi-exclamation-triangle"/>
                        </p:commandButton>
                    </p:column>
                </p:dataTable>

                <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                    <p:commandButton value="Sim" type="button" styleClass="ui-confirmdialog-yes" icon="pi pi-check"/>
                    <p:commandButton value="Não" type="button" styleClass="ui-confirmdialog-no ui-button-secondary" icon="pi pi-times"/>
                </p:confirmDialog>
            </h:form>
        </div>

        <p:dialog header="Cliente" widgetVar="dlgCliente" modal="true"
                  responsive="true" width="420" draggable="false" resizable="false">
            <h:form id="formDialog">
                <p:outputPanel rendered="#{clienteController.selecionado != null}">
                    <h:panelGrid columns="1" cellpadding="4" style="width: 100%">
                        <p:outputLabel for="razao" value="Razão social"/>
                        <p:inputText id="razao" value="#{clienteController.selecionado.razaoSocial}"
                                     maxlength="150" style="width: 100%"/>

                        <p:outputLabel for="cnpj" value="CNPJ (somente números ou com pontuação)"/>
                        <p:inputText id="cnpj" value="#{clienteController.selecionado.cnpj}"
                                     maxlength="18" style="width: 100%"/>
                    </h:panelGrid>

                    <div style="margin-top: 1rem; display: flex; gap: .5rem; justify-content: flex-end">
                        <p:commandButton value="Cancelar" icon="pi pi-times" styleClass="ui-button-secondary"
                                         type="button" onclick="PF('dlgCliente').hide()"/>
                        <p:commandButton value="Salvar" icon="pi pi-check"
                                         actionListener="#{clienteController.salvar}"
                                         process="@form" update="@form :formLista:tabela :msgs"
                                         oncomplete="if (args &amp;&amp; args.fechar) PF('dlgCliente').hide()"/>
                    </div>
                </p:outputPanel>
            </h:form>
        </p:dialog>
    </ui:define>
</ui:composition>
