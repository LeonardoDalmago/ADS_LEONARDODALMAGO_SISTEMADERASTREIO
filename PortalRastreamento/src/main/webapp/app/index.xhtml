<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">

    <ui:define name="title">Início</ui:define>

    <ui:define name="content">
        <div class="card">
            <h2>Olá, #{loginController.usuarioLogado.nome}</h2>
            <p>Perfil: #{loginController.usuarioLogado.perfil.descricao}</p>

            <h:outputText value="Esta área é restrita ao administrador."
                          rendered="#{param.negado == 'true'}"
                          style="color: #c62828; font-weight: bold; display: block; margin-bottom: 1rem"/>

            <div style="display: flex; gap: .6rem; flex-wrap: wrap">
                <p:button outcome="/app/pedido/index" value="Pedidos" icon="pi pi-box"/>

                <p:button outcome="/admin/cliente/index" value="Clientes" icon="pi pi-users"
                          rendered="#{loginController.admin}"/>
                <p:button outcome="/admin/transportadora/index" value="Transportadoras" icon="pi pi-truck"
                          rendered="#{loginController.admin}"/>
                <p:button outcome="/admin/usuario/index" value="Usuários" icon="pi pi-id-card"
                          rendered="#{loginController.admin}"/>

                <h:form>
                    <p:commandButton value="Sair" icon="pi pi-sign-out" styleClass="ui-button-secondary"
                                     action="#{loginController.sair}" ajax="false"/>
                </h:form>
            </div>
        </div>
    </ui:define>
</ui:composition>
