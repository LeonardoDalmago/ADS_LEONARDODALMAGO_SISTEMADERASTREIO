<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">

    <ui:define name="title">Pedidos</ui:define>

    <ui:define name="content">
        <p:growl id="msgs" life="4000"/>

        <div class="card">
            <h:form id="formLista">
                <h2>Pedidos</h2>

                <div style="display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1rem">
                    <p:inputText value="#{pedidoController.termoBusca}"
                                 placeholder="Número, descrição ou cliente" style="width: 18rem"/>
                    <p:selectOneMenu value="#{pedidoController.statusFiltro}" style="min-width: 12rem">
                        <f:selectItem itemLabel="Todos os status" itemValue="" noSelectionOption="true"/>
                        <f:selectItems value="#{pedidoController.statusLista}" var="s"
                                       itemValue="#{s}" itemLabel="#{s.descricao}"/>
                    </p:selectOneMenu>
                    <p:commandButton value="Buscar" icon="pi pi-search"
                                     actionListener="#{pedidoController.buscar}"
                                     process="@form" update="tabela :msgs"/>
                    <p:commandButton value="Limpar" icon="pi pi-times" styleClass="ui-button-secondary"
                                     actionListener="#{pedidoController.limpar}"
                                     process="@this" update="@form :msgs"/>
                    <p:commandButton value="Novo pedido" icon="pi pi-plus"
                                     actionListener="#{pedidoController.novo}"
                                     process="@this" update=":formDialog"
                                     oncomplete="PF('dlgPedido').show()"/>
                </div>

                <p:dataTable id="tabela" var="item" value="#{pedidoController.lista}"
                             rows="10" paginator="true" emptyMessage="Nenhum pedido encontrado">
                    <p:column headerText="Número" style="width: 8rem">
                        <h:outputText value="#{item.numeroPedido}"/>
                    </p:column>
                    <p:column headerText="Cliente">
                        <h:outputText value="#{item.cliente.razaoSocial}"/>
                    </p:column>
                    <p:column headerText="Descrição">
                        <h:outputText value="#{item.descricao}"/>
                    </p:column>
                    <p:column headerText="Status" style="width: 9rem">
                        <h:outputText value="#{item.status.descricao}"/>
                    </p:column>
                    <p:column headerText="Previsão" style="width: 8rem">
                        <h:outputText value="#{item.previsaoEntrega}">
                            <f:convertDateTime type="localDate" pattern="dd/MM/yyyy"/>
                        </h:outputText>
                    </p:column>
                    <p:column headerText="Transportadora">
                        <h:outputText value="#{item.transportadora.nome}"/>
                    </p:column>
                    <p:column headerText="Ações" style="width: 8rem">
                        <p:commandButton icon="pi pi-pencil" title="Editar / histórico"
                                         actionListener="#{pedidoController.editar(item)}"
                                         process="@this" update=":formDialog"
                                         oncomplete="PF('dlgPedido').show()"/>
                        <p:commandButton icon="pi pi-trash" title="Excluir" styleClass="ui-button-danger"
                                         actionListener="#{pedidoController.excluir(item)}"
                                         process="@this" update="tabela :msgs">
                            <p:confirm header="Confirmação" message="Deseja excluir este pedido e seu histórico?"
                                       icon="pi pi-exclamation-triangle"/>
                        </p:commandButton>
                    </p:column>
                </p:dataTable>

                <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                    <p:commandButton value="Sim" type="button" styleClass="ui-confirmdialog-yes" icon="pi pi-check"/>
                    <p:commandButton value="Não" type="button" styleClass="ui-confirmdialog-no ui-button-secondary" icon="pi pi-times"/>
                </p:confirmDialog>
            </h:form>
        </div>

        <p:dialog header="Pedido" widgetVar="dlgPedido" modal="true"
                  responsive="true" width="720" draggable="false" resizable="false">
            <h:form id="formDialog">
                <p:outputPanel rendered="#{pedidoController.selecionado != null}">
                    <h:panelGrid columns="2" cellpadding="5" style="width: 100%">
                        <p:outputLabel for="numero" value="Número do pedido"/>
                        <p:inputText id="numero" value="#{pedidoController.selecionado.numeroPedido}"
                                     maxlength="30"/>

                        <p:outputLabel for="cliente" value="Cliente"/>
                        <p:selectOneMenu id="cliente" value="#{pedidoController.selecionado.cliente}"
                                         style="min-width: 18rem">
                            <f:selectItem itemLabel="Selecione..." itemValue="" noSelectionOption="true"/>
                            <f:selectItems value="#{pedidoController.clientes}" var="c"
                                           itemValue="#{c}" itemLabel="#{c.razaoSocial}"/>
                        </p:selectOneMenu>

                        <p:outputLabel for="descricao" value="Descrição"/>
                        <p:inputText id="descricao" value="#{pedidoController.selecionado.descricao}"
                                     maxlength="255" style="width: 100%"/>

                        <p:outputLabel for="status" value="Status"/>
                        <p:selectOneMenu id="status" value="#{pedidoController.selecionado.status}"
                                         style="min-width: 14rem">
                            <f:selectItems value="#{pedidoController.statusLista}" var="st"
                                           itemValue="#{st}" itemLabel="#{st.descricao}"/>
                        </p:selectOneMenu>

                        <p:outputLabel for="previsao" value="Previsão de entrega"/>
                        <p:datePicker id="previsao" value="#{pedidoController.selecionado.previsaoEntrega}"
                                      pattern="dd/MM/yyyy" showIcon="true"/>

                        <p:outputLabel for="transportadora" value="Transportadora"/>
                        <p:selectOneMenu id="transportadora"
                                         value="#{pedidoController.selecionado.transportadora}"
                                         style="min-width: 18rem">
                            <f:selectItem itemLabel="Nenhuma" itemValue="" noSelectionOption="true"/>
                            <f:selectItems value="#{pedidoController.transportadoras}" var="t"
                                           itemValue="#{t}" itemLabel="#{t.nome}"/>
                        </p:selectOneMenu>

                        <p:outputLabel for="observacoes" value="Observações"/>
                        <p:inputTextarea id="observacoes" value="#{pedidoController.selecionado.observacoes}"
                                         rows="3" style="width: 100%"/>
                    </h:panelGrid>

                    <!-- Historico: so aparece depois que o pedido foi salvo -->
                    <p:outputPanel id="painelHistorico"
                                   rendered="#{pedidoController.selecionado.id != null}">
                        <h4>Histórico de andamento</h4>

                        <div style="display: flex; gap: .5rem; margin-bottom: .8rem">
                            <p:inputText id="txtHistorico" value="#{pedidoController.novoHistorico}"
                                         placeholder="Ex.: Pedido saiu para entrega" maxlength="255"
                                         style="flex: 1"/>
                            <p:commandButton value="Adicionar" icon="pi pi-plus"
                                             actionListener="#{pedidoController.adicionarHistorico}"
                                             process="@this txtHistorico"
                                             update="painelHistorico :msgs :formLista:tabela"/>
                        </div>

                        <p:dataTable id="tblHistorico" var="h" value="#{pedidoController.selecionado.historico}"
                                     rows="5" paginator="true" emptyMessage="Ainda não há movimentações.">
                            <p:column headerText="Data" style="width: 11rem">
                                <h:outputText value="#{h.data}">
                                    <f:convertDateTime type="localDateTime" pattern="dd/MM/yyyy HH:mm"/>
                                </h:outputText>
                            </p:column>
                            <p:column headerText="Andamento">
                                <h:outputText value="#{h.descricao}"/>
                            </p:column>
                        </p:dataTable>
                    </p:outputPanel>

                    <div style="margin-top: 1rem; display: flex; gap: .5rem; justify-content: flex-end">
                        <p:commandButton value="Fechar" icon="pi pi-times" styleClass="ui-button-secondary"
                                         type="button" onclick="PF('dlgPedido').hide()"/>
                        <p:commandButton value="Salvar" icon="pi pi-check"
                                         actionListener="#{pedidoController.salvar}"
                                         process="@form" update="@form :formLista:tabela :msgs"
                                         oncomplete="if (args &amp;&amp; args.fechar) PF('dlgPedido').hide()"/>
                    </div>
                </p:outputPanel>
            </h:form>
        </p:dialog>
    </ui:define>
</ui:composition>
