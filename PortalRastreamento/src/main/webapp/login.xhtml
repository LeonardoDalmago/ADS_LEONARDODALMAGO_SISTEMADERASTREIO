<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui">
    <h:head>
        <title>Login - Portal de Rastreamento</title>
        <style>
            body { font-family: sans-serif; background: #eef1f5; margin: 0; }
            .caixa { max-width: 360px; margin: 8vh auto; background: #fff; padding: 2rem;
                     border-radius: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.12); }
            .campo { margin-bottom: 1rem; display: flex; flex-direction: column; gap: .3rem; }
            .campo input { width: 100%; box-sizing: border-box; }
            .links { margin-top: 1.2rem; text-align: center; }
        </style>
    </h:head>
    <h:body>
        <div class="caixa">
            <h2>Portal de Rastreamento</h2>
            <p>Acesso dos funcionários</p>

            <h:form id="formLogin">
                <p:messages id="msgs" closable="true"/>

                <div class="campo">
                    <p:outputLabel for="login" value="Login"/>
                    <p:inputText id="login" value="#{loginController.login}"
                                 required="true" requiredMessage="Informe o login"/>
                </div>
                <div class="campo">
                    <p:outputLabel for="senha" value="Senha"/>
                    <p:password id="senha" value="#{loginController.senha}" feedback="false"
                                required="true" requiredMessage="Informe a senha"/>
                </div>

                <p:commandButton value="Entrar" icon="pi pi-sign-in"
                                 action="#{loginController.entrar}" ajax="false"/>
            </h:form>

            <div class="links">
                <h:link outcome="rastreio" value="Consultar meu pedido (sem login)"/>
            </div>
        </div>
    </h:body>
</html>
